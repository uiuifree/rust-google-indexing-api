[package]
name = "google-indexing-api"
version = "1.0.0"
edition = "2021"

authors = ["uiuifree"]
description = "GoogleIndexing API"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
keywords = ["IndexingAPI", "GoogleIndexingAPI", "GoogleForJobs", "google", "api"]

repository = "https://github.com/uiuifree/rust-google-indexing-api"
[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
urlencoding = { version = "2.1.3" }
# Json
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

hyper = "1.0"
hyper-tls = "0.6"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http-body-util = "0.1"
[dev-dependencies]
tokio = { version = "1.48", features = ["full"] }
yup-oauth2 = "12.1"
