[package]
name = "google-indexing-api"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"

authors = ["uiuifree"]
description = "Client for the Google Indexing API: notify Google of updated or deleted URLs one by one or in batch, and fetch notification metadata"
license = "MIT"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
keywords = ["IndexingAPI", "GoogleIndexingAPI", "GoogleForJobs", "google", "api"]
categories = ["api-bindings", "web-programming"]

repository = "https://github.com/uiuifree/rust-google-indexing-api"
documentation = "https://docs.rs/google-indexing-api"
[dependencies]
reqwest = { version = "0.13", features = ["json"] }
urlencoding = { version = "2.1.3" }
# Json
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[dev-dependencies]
tokio = { version = "1.48", features = ["full"] }
yup-oauth2 = "12.1"
httpmock = "0.7"
