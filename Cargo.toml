[package]
name = "google-indexing-api"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"

authors = ["uiuifree"]
description = "Async Rust client for the Google Indexing API: notify Google of updated or deleted URLs (JobPosting / BroadcastEvent pages) one by one or in batches of up to 100, and fetch notification metadata"
license = "MIT"
readme = "README.md"

# crates.io allows at most 5 keywords and 5 categories.
keywords = ["google", "indexing-api", "seo", "google-for-jobs", "job-posting"]
categories = ["api-bindings", "web-programming", "asynchronous"]

homepage = "https://github.com/uiuifree/rust-google-indexing-api"
repository = "https://github.com/uiuifree/rust-google-indexing-api"
documentation = "https://docs.rs/google-indexing-api"

exclude = [".github/", ".idea/", ".claude/", "test.json"]

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
urlencoding = { version = "2.1.3" }
# Json
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["full"] }
yup-oauth2 = "12.1"
httpmock = "0.7"
